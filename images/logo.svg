<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="boardGrad" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1E293B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="traceGrad" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="chipGrad" x1="312" y1="312" x2="712" y2="712" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#E2E8F0"/>
    </linearGradient>
    <radialGradient id="glow" cx="512" cy="512" r="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 底板 -->
  <rect x="112" y="112" width="800" height="800" rx="200" fill="url(#boardGrad)"/>
  <rect x="112" y="112" width="800" height="800" rx="200" stroke="#334155" stroke-width="4"/>

  <!-- 光晕 -->
  <circle cx="512" cy="512" r="360" fill="url(#glow)"/>

  <!-- 外围走线 -->
  <g stroke="url(#traceGrad)" stroke-width="18" stroke-linecap="round" fill="none">
    <path d="M240 360H320V280"/>
    <path d="M240 512H320V440"/>
    <path d="M240 664H320V744"/>
    <path d="M784 360H704V280"/>
    <path d="M784 512H704V440"/>
    <path d="M784 664H704V744"/>
    <path d="M360 240V320H440"/>
    <path d="M512 240V320H440"/>
    <path d="M584 704V784H664"/>
    <path d="M440 704V784H360"/>
  </g>

  <!-- 焊盘 -->
  <g fill="#38BDF8">
    <circle cx="240" cy="280" r="22"/>
    <circle cx="240" cy="440" r="22"/>
    <circle cx="240" cy="744" r="22"/>
    <circle cx="784" cy="280" r="22"/>
    <circle cx="784" cy="440" r="22"/>
    <circle cx="784" cy="744" r="22"/>
    <circle cx="360" cy="240" r="22"/>
    <circle cx="664" cy="784" r="22"/>
    <circle cx="360" cy="784" r="22"/>
  </g>

  <!-- 中央芯片 -->
  <rect x="352" y="352" width="320" height="320" rx="48" fill="url(#chipGrad)"/>
  <rect x="352" y="352" width="320" height="320" rx="48" stroke="#94A3B8" stroke-width="6"/>

  <!-- 芯片引脚 -->
  <g fill="#334155">
    <rect x="400" y="320" width="28" height="32" rx="4"/>
    <rect x="460" y="320" width="28" height="32" rx="4"/>
    <rect x="520" y="320" width="28" height="32" rx="4"/>
    <rect x="580" y="320" width="28" height="32" rx="4"/>
    <rect x="400" y="672" width="28" height="32" rx="4"/>
    <rect x="460" y="672" width="28" height="32" rx="4"/>
    <rect x="520" y="672" width="28" height="32" rx="4"/>
    <rect x="580" y="672" width="28" height="32" rx="4"/>
    <rect x="320" y="400" width="32" height="28" rx="4"/>
    <rect x="320" y="460" width="32" height="28" rx="4"/>
    <rect x="320" y="520" width="32" height="28" rx="4"/>
    <rect x="320" y="580" width="32" height="28" rx="4"/>
    <rect x="672" y="400" width="32" height="28" rx="4"/>
    <rect x="672" y="460" width="32" height="28" rx="4"/>
    <rect x="672" y="520" width="32" height="28" rx="4"/>
    <rect x="672" y="580" width="32" height="28" rx="4"/>
  </g>

  <!-- 芯片内核 -->
  <rect x="432" y="432" width="160" height="160" rx="24" fill="#0EA5E9"/>
  <rect x="456" y="456" width="112" height="112" rx="16" fill="#F0F9FF"/>
</svg>

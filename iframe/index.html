<!doctype html>
<html lang="zh-Hans">

<head>
	<title>JLC EDA Agent</title>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<link rel="stylesheet" href="/iframe/overlayscrollbars.css" />
	<link rel="stylesheet" href="/iframe/chat.css" />
	<link rel="stylesheet" href="/iframe/common.css" />
</head>

<body class="page-loading">
	<div class="page-loading-mask" role="status" aria-live="polite" aria-label="页面加载中">
		<span class="page-loading-spinner" aria-hidden="true"></span>
		<span class="page-loading-text">载入中...</span>
	</div>
	<div class="chat-page">
		<aside class="chat-sidebar" aria-label="会话侧边栏">
			<div class="chat-sidebar-header">
				<button class="chat-sidebar-new-button" type="button" title="新建对话" aria-label="新建对话">
					<svg viewBox="0 0 20 20" focusable="false" aria-hidden="true">
						<use xlink:href="#icon-comment-add"></use>
					</svg>
					<span class="chat-sidebar-new-text">新对话</span>
				</button>
			</div>
			<ul class="chat-sidebar-list" role="listbox" aria-label="对话历史列表"></ul>
			<div class="chat-sidebar-footer">
				<button class="chat-sidebar-toggle" type="button" title="收起侧边栏" aria-label="收起侧边栏">
					<svg class="chat-sidebar-toggle-icon" viewBox="0 0 20 20" focusable="false" aria-hidden="true">
						<use xlink:href="#icon-chevron-left"></use>
					</svg>
				</button>
			</div>
		</aside>
		<div class="chat-main">
			<button class="chat-sidebar-expand" type="button" title="展开侧边栏" aria-label="展开侧边栏">
				<svg viewBox="0 0 20 20" focusable="false" aria-hidden="true">
					<use xlink:href="#icon-chevron-right"></use>
				</svg>
			</button>
			<div class="chat-history" aria-label="聊天历史记录"></div>
			<div class="chat-todo-panel" aria-live="polite" aria-label="任务列表"></div>
			<div class="chat-input-box">
				<div class="chat-attachment-row">
					<button class="file-upload-button" type="button" title="添加文件" aria-label="添加文件">
						<span>+</span>
					</button>
					<input class="file-upload-input" type="file" accept="image/*,.txt,.md,.markdown,.csv,.rtf" multiple
						hidden />
					<div class="image-attachment-list" aria-label="已添加文件" aria-live="polite"></div>
				</div>
				<div class="chat-textarea-scroll">
					<div class="chat-textarea" contenteditable="plaintext-only" role="textbox" aria-multiline="true"
						data-placeholder="向 JLC EDA Agent 提问"></div>
				</div>
				<div class="chat-input-bottom">
					<div class="model-select-panel">
						<div class="model-select-control">
							<select class="model-select" aria-label="选择平台"></select>
							<button class="model-select-trigger" type="button" aria-haspopup="listbox"
								aria-expanded="false"></button>
							<div class="model-select-menu" role="listbox"></div>
							<svg viewBox="0 0 14 7" aria-hidden="true" focusable="false">
								<use xlink:href="#icon-chevron-down"></use>
							</svg>
						</div>
					</div>
					<div class="send-area">
						<button class="send-button" type="button" title="发送消息" aria-label="发送消息">
							<svg viewBox="0 0 20 20" aria-hidden="true" focusable="false">
								<use class="send-icon-triangle" xlink:href="#icon-send-triangle"></use>
								<use class="send-icon-square" xlink:href="#icon-send-square"></use>
								<use class="send-icon-circle" xlink:href="#icon-send-circle"></use>
							</svg>
						</button>
					</div>
				</div>
			</div>
		</div>
	</div>
	<div class="chat-context-menu" role="menu" aria-label="消息操作菜单">
		<button class="chat-context-menu-item" type="button" data-action="copy-round" role="menuitem">复制</button>
		<button class="chat-context-menu-item" type="button" data-action="copy-all" role="menuitem">复制全部</button>
	</div>
	<script src="/dist/iframe/chat.js"></script>
</body>

</html>
